name: Public octagon small-gap Lean CI

on:
  push:
    branches: [octagon-smallgap-ci-2026-07-28]
  workflow_dispatch:

concurrency:
  group: public-octagon-smallgap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lean dependency cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.elan/toolchains
            .lake/packages
          key: public-octagon-lean-v430-mathlib430
      - name: Resolve mathlib when absent
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .lake/packages/mathlib ]; then lake update; fi
          if [ ! -d .lake/packages/mathlib/.lake/build/lib/lean/Mathlib ]; then lake exe cache get; fi
      - name: Kernel-check small-gap reserve
        shell: bash
        run: |
          set -o pipefail
          lake build OctagonCI --wfail 2>&1 | tee smallgap-lean.log
      - name: Reject proof holes
        shell: bash
        run: |
          ! grep -nE '\bsorry\b|sorryAx|^[[:space:]]*axiom[[:space:]]' \
            OctagonBase.lean SmallGapBernsteinStandalone.lean \
            SmallGapReserveStandalone.lean
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: octagon-smallgap-lean-logs
          path: smallgap-lean.log
          if-no-files-found: ignore
