name = "OctagonCI"
defaultTargets = ["OctagonCI"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.30.0"

[[lean_lib]]
name = "OctagonCI"
roots = [
  "WedgeSplitAlgebraV2",
  "WedgeSplitChain",
  "OctagonBase",
  "ArctanPolynomialBounds",
  "FirstSectorAlgebra",
  "SecondSectorDefectStandalone",
  "ThirdSectorDefectStandalone"
]
